<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicita tu Horario Deportivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="Horarios.css" />
</head>
<body>

  <div class="card">

    <div class="header">
      <span class="header-tag">Centro Deportivo</span>
      <h1>Solicita tu horario</h1>
      <p>Elige tu deporte y disponibilidad — Te confirmaremos en un apriximado de 24hrs </p>
    </div>

    <div class="form-body">

      <div class="name-row">
        <div>
          <label class="field-label" for="firstName">Nombre</label>
          <input type="text" id="firstName" placeholder="nombre" />
        </div>
        <div>
          <label class="field-label" for="lastName">Apellido</label>
          <input type="text" id="lastName" placeholder="ej. caroca" />
        </div>
      </div>

      <div>
        <label class="field-label" for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tucorreo@gmail.com" />
      </div>

      <div class="divider"></div>

      <div>
        <label class="field-label" style="margin-bottom:12px">Deporte de interés</label>
        <div class="sport-grid">

          <div class="sport-card">
            <input type="checkbox" id="futbol" />
            <label class="sport-label" for="futbol">
              <i class="ti ti-ball-football sport-icon"></i>
              <span class="sport-name">Fútbol</span>
              <span class="sport-desc">6 vs 6 · cancha techada</span>
            </label>
          </div>

          <div class="sport-card">
            <input type="checkbox" id="basquetbol" />
            <label class="sport-label" for="basquetbol">
              <i class="ti ti-ball-basketball sport-icon"></i>
              <span class="sport-name">Basquetbol</span>
              <span class="sport-desc">5 vs 5 · cancha techada</span>
            </label>
          </div>

          <div class="sport-card">
            <input type="checkbox" id="volei" />
            <label class="sport-label" for="volei">
              <i class="ti ti-ball-volleyball sport-icon"></i>
              <span class="sport-name">Vóleibol</span>
              <span class="sport-desc">6 vs 6 · cancha techada</span>
            </label>
          </div>

        </div>
      </div>

      <div class="divider"></div>

      <div class="time-row">
        <div>
          <label class="field-label" for="dia">Día preferido</label>
          <select id="dia">
            <option value="">Seleccionar</option>
            <option>Lunes</option>
            <option>Martes</option>
            <option>Miércoles</option>
            <option>Jueves</option>
            <option>Viernes</option>
           
          </select>
        </div>
        <div>
          <label class="field-label" for="hora">Hora de inicio</label>
          <select id="hora">
            <option value="">Seleccionar</option>
            <option>13:00</option>
            
          </select>
        </div>
        <div>
          <label class="field-label" for="duracion">Duración</label>
          <select id="duracion">
            <option value="">Seleccionar</option>
            <option>45 min</option>
          </select>
        </div>
      </div>

      <div>
        <label class="field-label" for="comentarios">Comentarios adicionales</label>
        <textarea id="comentarios" placeholder="Número de jugadores, requisitos especiales, etc."></textarea>
      </div>

      <div id="successBanner" class="success-banner">
        <i class="ti ti-circle-check" style="font-size:20px"></i>
        <span>¡Solicitud enviada! Te confirmaremos tu horario pronto.</span>
      </div>

      <div class="submit-row">
        <p class="submit-note">
        Al enviar la solicitud, sera revisada lo mas antes posible y se les mandara la confirmacion por el 
        gmail.
        </p>
        <button class="submit-btn" onclick="handleSubmit()">
          Enviar solicitud <i class="ti ti-arrow-right"></i>
        </button>
      </div>

    </div>
  </div>

  <script src="Horarios.js"></script>
</body>
</html>
