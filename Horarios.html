  <!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicita tu Horario Deportivo</title>
  <link rel="stylesheet" href="Horarios.css">
</head>

<body>

  <main class="card">

    <header class="header">
      <span class="header-tag">Gimnasio escolar</span>

      <h1>Solicita tu horario</h1>

      <p>
        Elige tu deporte y dia .   
      </p>
    </header>

    <!-- FORMULARIO -->
    <form class="form-body" action="https://formsubmit.co/horariossip@gmail.com" method="POST">

      <!-- Configuración de FormSubmit -->
      <input type="hidden" name="_subject" value="Nueva solicitud de horario deportivo">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <!-- NOMBRE -->
      <section class="name-row">

        <article>
          <label class="field-label" for="firstName">
            Nombre
          </label>

          <input type="text" id="firstName" name="Nombre" placeholder="Nombre" required>
        </article>

        <article>
          <label class="field-label" for="lastName">
            Apellido
          </label>

          <input type="text" id="lastName" name="Apellido" placeholder="Apellido" required>
        </article>

      </section>

      <!-- CORREO -->
      <section>

        <label class="field-label" for="email">
          Correo electrónico
        </label>

        <input type="email" id="email" name="Correo" placeholder="@alumnos.sip.cl" required>

      </section>

      <hr class="division">

      <!-- DEPORTES -->
      <section>

        <label class="field-label">
          Deporte de interés
        </label>

        <section class="sport-grid">

          <!-- FÚTBOL -->
          <article class="sport-card">

            <input type="radio" id="futbol" name="Deporte" value="Fútbol">

            <label class="sport-label" for="futbol">

              <span class="sport-icon">⚽</span>

              <span class="nombredeporte">
                Fútbol
              </span>

              <span class="sport-desc">
                6 vs 6
              </span>

            </label>

          </article>

          <!-- BASQUETBOL -->
          <article class="sport-card">

            <input type="radio" id="basquetbol" name="Deporte" value="Basquetbol">

            <label class="sport-label" for="basquetbol">

              <span class="sport-icon">🏀</span>

              <span class="nombredeporte">
                Basquetbol
              </span>

              <span class="sport-desc">
                5 vs 5
              </span>

            </label>

          </article>

          <!-- VOLEIBOL -->
          <article class="sport-card">

            <input type="radio" id="volei" name="Deporte" value="Vóleibol">

            <label class="sport-label" for="volei">

              <span class="sport-icon">🏐</span>

              <span class="nombredeporte">
                Vóleibol
              </span>

              <span class="sport-desc">
                6 vs 6
              </span>

            </label>

          </article>

        </section>

      </section>

      <hr class="division">

      <!-- DÍA, HORA Y DURACIÓN -->
      <section class="time-row">

        <article>

          <label class="field-label" for="dia">
            Día preferido
          </label>

          <select id="dia" name="Día" required>

            <option value="">
              Seleccionar
            </option>

            <option>Lunes</option>
            <option>Martes</option>
            <option>Jueves</option>
            

          </select>

        </article>

        <article>

          <label class="field-label" for="hora">
            Hora de inicio
          </label>

          <select id="hora" name="Hora" required>

            <option value="">
              Seleccionar
            </option>

            <option>13:00</option>

          </select>

        </article>

        <article>

          <label class="field-label" for="duracion">
            Duración
          </label>

          <select id="duracion" name="Duración" required>

            <option value="">
              Seleccionar
            </option>

            <option>40 min</option>

          </select>

        </article>

        <article>

          <label class="field-label" for="cursos1">
            Cursos que se enfrentaran
          </label>

          <select id="curso1" name="curso1" required>

            <option value="">
              Seleccionar
            </option>

            <option>7°A</option>
            <option>7°B</option>
            <option>7°C</option>
            <option>8°A</option>
            <option>8°B</option>
            <option>8°C</option>
            <option>I°A</option>
            <option>I°B</option>
            <option>I°C</option>
            <option>II°A</option>
            <option>II°B</option>
            <option>II°C</option>
            <option>III°A</option>
            <option>III°B</option>
            <option>III°C</option>
            <option>IV°A</option>
            <option>IV°B</option>
            <option>IV°C</option>
            

          </select>

        </article>

                <article>

          <label class="field-label" for="cursos2">
            Cursos que se enfrentaran
          </label>

          <select id="curso2" name="curso2" required>

            <option value="">
              Seleccionar
            </option>

            <option>7°A</option>
            <option>7°B</option>
            <option>7°C</option>
            <option>8°A</option>
            <option>8°B</option>
            <option>8°C</option>
            <option>I°A</option>
            <option>I°B</option>
            <option>I°C</option>
            <option>II°A</option>
            <option>II°B</option>
            <option>II°C</option>
            <option>III°A</option>
            <option>III°B</option>
            <option>III°C</option>
            <option>IV°A</option>
            <option>IV°B</option>
            <option>IV°C</option>
            

          </select>

        </article>


      </section>

     
      <!-- MENSAJE DE ÉXITO -->
      <aside id="successBanner" class="success-banner">

        <span>✓</span>

        <span>
          ¡Solicitud enviada! Te confirmaremos tu horario pronto.
        </span>

      </aside>

      <!-- BOTÓN -->
      <footer class="submit-row">

        <p class="submit-note">

          Al enviar la solicitud, será revisada lo más
          antes posible y se les mandará la confirmación
          por Gmail.

        </p>

        <button class="submit-btn" type="submit">
          Enviar solicitud →
        </button>

      </footer>

    </form>

  </main>

  <script src="Horarios.js"></script>

</body>
</html>
