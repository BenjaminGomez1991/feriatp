<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="stley.css">
</head>

<body>

    <!-- Contenedor principal del inicio de sesión -->
    <main>
        <section class="inicio">

            <!-- Mensaje de bienvenida -->
            <header>
                <h1>Bienvenido</h1>
                <p>Inicia sesión para continuar
                    y reservar tu partido 😎 </p>
            </header>

            <!-- Datos necesarios para validar el acceso -->
            <form action="https://feriatp-ffdu.vercel.app/Horarios.html">

                <!-- Identificación del usuario -->
                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <!-- Contraseña del usuario -->
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <!-- Envía las credenciales al archivo JavaScript -->
                <button type="submit">Iniciar sesión</button>

            </form>


        </section>
    </main>

</body>
<!-- Lógica de validación del inicio de sesión -->
<script src="JavaScrpit.js"></script>
</html>
