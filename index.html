<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="stley.css">
</head>

<body>

    <main>
        <section class="login">

            <header>
                <h1>Bienvenido</h1>
                <p>Inicia sesión para continuar
                    y reservar tu partido 😎 </p>
            </header>

            <form action="https://feriatp-ffdu.vercel.app/Horarios.html">

                <label for="correo">Correo electrónico</label>
                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >

                <button type="submit">Iniciar sesión</button>

            </form>


        </section>
    </main>

</body>
<script src="JavaScrpit.js"></script>
</html>
